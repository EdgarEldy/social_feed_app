org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# CI's build-android job (.github/workflows/ci.yml) was consistently failing
# release builds with "Caught exception: Already watching path" followed by
# "Gradle build failed to produce an .apk file", no separate Gradle FAILURE
# message. That is Gradle's file-system-watching service (used for
# incremental build caching) getting into a broken state on the GitHub
# Actions runner's filesystem; disabling it is the standard workaround for
# this exact symptom. Local `flutter run`/`flutter build` incremental build
# speed on a developer machine is unaffected by this repo-level default in
# any noticeable way for a project this size.
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
